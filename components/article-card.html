<article>
  <style>
    @scope {
      :scope { box-sizing: border-box; max-inline-size: 32rem; overflow: hidden; border: 1px solid var(--bui-border, #e4e2eb); border-radius: 1rem; background: var(--bui-surface, #fff); color: var(--bui-text, #202437); font: 400 1rem/1.6 system-ui, sans-serif; overflow-wrap: anywhere; }
      :scope > header { padding: clamp(1.5rem, 5vw, 2.5rem); background: var(--bui-tint, #f1edff); }
      :scope > header > p { margin: 0 0 1rem; color: var(--bui-primary, #5943d6); font-size: .75rem; font-weight: 750; letter-spacing: .12em; }
      :scope > header > h2 { max-inline-size: 14ch; margin: 0; font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 750; line-height: 1.12; letter-spacing: -.045em; text-wrap: balance; }
      :scope > p { margin: 0; padding: 1.5rem 1.5rem 1rem; color: var(--bui-muted, #585c70); }
      :scope > footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; padding: 0 1.5rem 1.25rem; font-size: .875rem; }
      :scope > footer > span { color: var(--bui-muted, #585c70); }
      :scope > footer > a { display: inline-flex; align-items: center; min-block-size: 2.75rem; gap: .5rem; color: var(--bui-primary, #5943d6); font-weight: 700; text-decoration-thickness: .08em; text-underline-offset: .2em; }
      :scope > footer > a:hover { text-decoration-thickness: .16em; }
      :scope > footer > a:focus-visible { outline: 3px solid var(--bui-primary, #5943d6); outline-offset: 4px; border-radius: .25rem; }
    }
  </style>
  <header>
    <p>FIELD NOTES · 06</p>
    <h2>Small details. Better reading.</h2>
  </header>
  <p>A practical guide to making space, choosing a rhythm, and helping your words feel at home.</p>
  <footer>
    <span>5 min read</span>
    <a href="https://example.com/journal/small-details" aria-label="Read the story: Small details. Better reading.">Read the story <span aria-hidden="true">↗</span></a>
  </footer>
</article>
