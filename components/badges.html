<div data-bui="badges" role="group" aria-label="Article labels" style="box-sizing:border-box;display:flex;max-inline-size:100%;flex-wrap:wrap;align-items:center;gap:.5rem;margin:0;color:var(--bui-text,#20242e);font:400 1rem/1.5 var(--bui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);overflow-wrap:anywhere;color-scheme:light;">
  <style>
    @scope to ([data-bui]) {
      .bui-badge { text-wrap: pretty; }
      @media (forced-colors: active) {
        .bui-badge { outline: 1px solid CanvasText; outline-offset: -1px; }
      }
    }
  </style>
  <!-- These labels are informative, not clickable filters. Edit their wording. -->
  <span class="bui-badge" style="box-sizing:border-box;max-inline-size:100%;padding:.3rem .75rem;border:1px solid #ded5f3;border-radius:999px;background:var(--bui-tint,#f6f4fc);color:var(--bui-accent,#5a35cc);font-size:.8rem;font-weight:700;">Design notes</span>
  <span class="bui-badge" style="box-sizing:border-box;max-inline-size:100%;padding:.3rem .75rem;border:1px solid #bedcc9;border-radius:999px;background:#edf8f1;color:#235b3c;font-size:.8rem;font-weight:700;">Updated</span>
  <span class="bui-badge" style="box-sizing:border-box;max-inline-size:100%;padding:.3rem .75rem;border:1px solid var(--bui-border,#e3e3ec);border-radius:999px;background:var(--bui-surface,#fff);color:var(--bui-muted,#555d6d);font-size:.8rem;font-weight:650;">5 min read</span>
</div>
