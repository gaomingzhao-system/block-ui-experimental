<div role="region" aria-label="Comparison of article formats; scroll horizontally if needed" tabindex="0">
  <style>
    @scope {
      :scope { box-sizing: border-box; max-inline-size: 100%; overflow-x: auto; border: 1px solid var(--bui-border, #e4e2eb); border-radius: 1rem; background: var(--bui-surface, #fff); color: var(--bui-text, #202437); font: 400 .9375rem/1.6 system-ui, sans-serif; }
      :scope:focus-visible { outline: 3px solid var(--bui-primary, #5943d6); outline-offset: 4px; }
      :scope > table { inline-size: 100%; border-collapse: collapse; text-align: start; }
      :scope > table > caption { padding: 1.25rem; text-align: start; font-size: 1.125rem; font-weight: 750; }
      :scope > table > thead { background: var(--bui-tint, #f1edff); }
      :scope > table > thead > tr > th { padding: .75rem 1.25rem; font-size: .75rem; font-weight: 750; text-align: start; white-space: nowrap; }
      :scope > table > tbody > tr > th { padding: 1rem 1.25rem; border-block-start: 1px solid var(--bui-border, #e4e2eb); font-weight: 650; text-align: start; white-space: nowrap; }
      :scope > table > tbody > tr > td { padding: 1rem 1.25rem; border-block-start: 1px solid var(--bui-border, #e4e2eb); color: var(--bui-muted, #585c70); }
      :scope > table > tbody > tr > td:last-child { white-space: nowrap; }
    }
  </style>
  <table>
    <caption>Choose the right shape for your story.</caption>
    <thead><tr><th scope="col">Format</th><th scope="col">Best for</th><th scope="col">Reading time</th></tr></thead>
    <tbody>
      <tr><th scope="row">Field note</th><td>One useful observation</td><td>2–3 min</td></tr>
      <tr><th scope="row">Guide</th><td>A clear path through a problem</td><td>5–8 min</td></tr>
      <tr><th scope="row">Essay</th><td>An idea worth exploring</td><td>8–12 min</td></tr>
    </tbody>
  </table>
</div>
