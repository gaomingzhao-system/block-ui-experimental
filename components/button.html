<div role="group" aria-label="Button styles">
  <style>
    @scope {
      :scope { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; font: 400 .875rem/1.5 system-ui, sans-serif; }
      :scope > button { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; min-block-size: 2.75rem; max-inline-size: 100%; padding: .625rem 1rem; border: 1px solid var(--bui-primary, #5943d6); border-radius: .625rem; background: var(--bui-primary, #5943d6); color: var(--bui-primary-text, #fff); font: inherit; font-weight: 650; text-align: center; overflow-wrap: anywhere; cursor: pointer; }
      :scope > button[data-variant="outline"] { background: var(--bui-surface, #fff); color: var(--bui-primary, #5943d6); }
      :scope > button[data-variant="ghost"] { border-color: transparent; background: transparent; color: var(--bui-primary, #5943d6); }
      :scope > button:not(:disabled):hover { text-decoration: underline; text-underline-offset: .2em; }
      :scope > button:not(:disabled):active { box-shadow: inset 0 0 0 2px currentColor; }
      :scope > button:focus-visible { outline: 3px solid var(--bui-primary, #5943d6); outline-offset: 4px; }
      :scope > button:disabled { border-color: var(--bui-border, #e4e2eb); background: var(--bui-tint, #f1edff); color: var(--bui-muted, #585c70); cursor: not-allowed; }
      @media (forced-colors: active) {
        :scope > button { border-color: ButtonText; }
        :scope > button:disabled { border-color: GrayText; color: GrayText; }
      }
    }
  </style>
  <button type="button">Primary</button>
  <button type="button" data-variant="outline">Outline</button>
  <button type="button" data-variant="ghost">Ghost</button>
  <button type="button" disabled>Disabled</button>
</div>
