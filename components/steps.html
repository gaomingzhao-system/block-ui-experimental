<section>
  <style>
    @scope {
      :scope { box-sizing: border-box; padding: clamp(1.25rem, 4vw, 2rem); border: 1px solid var(--bui-border, #e4e2eb); border-radius: 1rem; background: var(--bui-surface, #fff); color: var(--bui-text, #202437); font: 400 1rem/1.6 system-ui, sans-serif; overflow-wrap: anywhere; }
      :scope > h2 { margin: 0 0 1.25rem; font-size: 1.375rem; font-weight: 750; line-height: 1.3; letter-spacing: -.025em; }
      :scope > ol { display: grid; gap: 1.25rem; margin: 0; padding-inline-start: 1.75rem; }
      :scope > ol > li { padding-inline-start: .5rem; }
      :scope > ol > li::marker { color: var(--bui-primary, #5943d6); font-weight: 750; }
      :scope > ol > li > strong { font-size: .9375rem; font-weight: 700; }
      :scope > ol > li > p { margin: .125rem 0 0; color: var(--bui-muted, #585c70); font-size: .9375rem; }
    }
  </style>
  <h2>From an idea to a page.</h2>
  <ol>
    <li><strong>Find the one thing.</strong><p>Choose the idea you want your reader to take away.</p></li>
    <li><strong>Give it a clear shape.</strong><p>Build around a useful heading, a few paragraphs, and a next step.</p></li>
    <li><strong>Read it out loud.</strong><p>Trim what gets in the way. Leave the parts that sound like you.</p></li>
  </ol>
</section>
