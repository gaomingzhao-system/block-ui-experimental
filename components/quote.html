<figure>
  <style>
    @scope {
      :scope { box-sizing: border-box; margin: 0; padding: clamp(1.5rem, 5vw, 2.5rem); border: 1px solid var(--bui-border, #e4e2eb); border-radius: 1rem; background: var(--bui-surface, #fff); color: var(--bui-text, #202437); font: 400 1rem/1.6 system-ui, sans-serif; overflow-wrap: anywhere; }
      :scope > blockquote { margin: 0; padding-inline-start: 1.25rem; border-inline-start: 3px solid var(--bui-primary, #5943d6); }
      :scope > blockquote > p { margin: 0; font-family: Georgia, serif; font-size: clamp(1.25rem, 3vw, 1.75rem); line-height: 1.5; text-wrap: pretty; }
      :scope > figcaption { margin-block-start: 1.25rem; padding-inline-start: 1.5rem; color: var(--bui-muted, #585c70); font-size: .875rem; }
      :scope > figcaption > strong { color: var(--bui-text, #202437); font-weight: 700; }
    }
  </style>
  <blockquote>
    <p>“The best page gives an idea enough room to become a conversation.”</p>
  </blockquote>
  <figcaption><strong>Alex Morgan</strong> · A fictional voice from our design journal</figcaption>
</figure>
