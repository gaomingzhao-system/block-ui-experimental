<article data-bui="author-card" aria-label="About the author" style="box-sizing:border-box;max-inline-size:42rem;margin:0;padding:clamp(1.25rem,4vw,2rem);border:1px solid var(--bui-border,#e3e3ec);border-radius:1.25rem;background:var(--bui-surface,#fff);color:var(--bui-text,#20242e);font:400 1rem/1.6 var(--bui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);overflow-wrap:anywhere;color-scheme:light;">
  <style>
    @scope to ([data-bui]) {
      :scope { container-type: inline-size; }
      .bui-author-layout { display: grid; gap: 1rem; }
      .bui-author-link:hover { text-decoration-thickness: .16em; }
      .bui-author-link:focus-visible { outline: 3px solid var(--bui-accent, #5a35cc); outline-offset: 4px; }
      @container (min-width: 24rem) {
        .bui-author-layout { grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 1.25rem; }
      }
    }
  </style>
  <div class="bui-author-layout">
    <span aria-hidden="true" style="display:inline-grid;box-sizing:border-box;inline-size:4rem;block-size:4rem;flex:0 0 auto;place-items:center;border:1px solid #ded5f3;border-radius:1.1rem;background:var(--bui-tint,#f6f4fc);color:var(--bui-accent,#5a35cc);font-size:1.35rem;font-weight:750;">JL</span>
    <div style="min-inline-size:0;">
      <p style="margin:0 0 .3rem;color:var(--bui-muted,#555d6d);font-size:.75rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;">Behind the words</p>
      <h2 style="margin:0 0 .5rem;font-size:1.3rem;line-height:1.3;letter-spacing:-.025em;">Jamie Lee</h2>
      <p style="margin:0;color:var(--bui-muted,#555d6d);">Writer, curious maker, and collector of small ideas. Sharing notes on designing a more thoughtful web.</p>
      <!-- Replace the example author, biography, initials, and destination. -->
      <a class="bui-author-link" href="https://example.com/about" style="display:inline-flex;box-sizing:border-box;min-block-size:2.75rem;align-items:center;gap:.4rem;margin-block-start:.5rem;color:var(--bui-accent,#5a35cc);font-size:.9rem;font-weight:650;text-decoration-line:underline;text-underline-offset:.2em;">More about Jamie <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</article>
