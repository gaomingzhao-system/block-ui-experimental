<aside aria-label="Writing tip">
  <style>
    @scope {
      :scope { box-sizing: border-box; padding: 1.25rem 1.5rem; border: 1px solid var(--bui-border, #e4e2eb); border-inline-start: 4px solid var(--bui-primary, #5943d6); border-radius: .75rem; background: var(--bui-tint, #f1edff); color: var(--bui-text, #202437); font: 400 1rem/1.6 system-ui, sans-serif; overflow-wrap: anywhere; }

      :scope > p > a { color: var(--bui-primary, #5943d6); text-decoration-thickness: .08em; text-underline-offset: .2em; }

  <strong>A little breathing room goes a long way.</strong>
  <p>Keep each paragraph focused on one idea. A clear rhythm makes even a long story easier to read. <a href="https://example.com/guides/writing">Explore the writing guide</a>.</p>
