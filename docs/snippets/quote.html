<figure data-bui="quote" style="box-sizing:border-box;max-inline-size:42rem;margin:0;padding:clamp(1.5rem,5vw,2.5rem);border:1px solid var(--bui-border,#e3e3ec);border-radius:1.25rem;background:var(--bui-surface,#fff);color:var(--bui-text,#20242e);font:400 1rem/1.6 var(--bui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);overflow-wrap:anywhere;color-scheme:light;">
  <style>
    @scope to ([data-bui]) {
      .bui-quote-text { text-wrap: pretty; }
      @media (forced-colors: active) {
        .bui-quote-mark { color: CanvasText; }
      }
    }
  </style>
  <span class="bui-quote-mark" aria-hidden="true" style="display:block;margin-block-end:.25rem;color:var(--bui-accent,#5a35cc);font:700 4rem/.9 Georgia,serif;">“</span>
  <blockquote style="margin:0;">
    <p class="bui-quote-text" style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.4rem,4vw,2rem);line-height:1.45;letter-spacing:-.025em;">The best pages give a good idea the space it needs to be understood.</p>
  </blockquote>
  <!-- This is original sample copy with fictional attribution; replace both. -->
  <figcaption style="display:flex;align-items:center;gap:.75rem;margin-block-start:1.5rem;color:var(--bui-muted,#555d6d);font-size:.875rem;">
    <span aria-hidden="true" style="display:inline-grid;inline-size:2.5rem;block-size:2.5rem;flex:0 0 auto;place-items:center;border-radius:50%;background:var(--bui-tint,#f6f4fc);color:var(--bui-accent,#5a35cc);font-weight:750;">AL</span>
    <span><strong style="display:block;color:var(--bui-text,#20242e);font-weight:700;">Alex Lane</strong>Writer &amp; maker · Example attribution</span>
  </figcaption>
</figure>
